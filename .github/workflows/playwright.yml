name: Playwright Bulk Video Automation

on:
  push:
    branches: [ main, master ]
    paths:
      - 'tsx logic/automation/input.txt'
  workflow_dispatch:

jobs:
  generate-videos:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.45.0-jammy
    steps:
    - name: Diagnostic Step
      run: |
        echo "=== SHOWING PRE-INSTALLED BROWSERS ==="
        ls -la /ms-playwright
        echo "=== SHOWING PLAYWRIGHT VERSION IN DOCKER ==="
        npx playwright --version